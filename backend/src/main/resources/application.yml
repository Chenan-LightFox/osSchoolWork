spring:
  application:
    name: osSchoolWork-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/os_school_work?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # Must be provided via environment variable and be at least 32 bytes for HS256.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
